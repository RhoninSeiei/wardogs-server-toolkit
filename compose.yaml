services:
  monitor:
    build: ./service
    user: "${WARDOGS_UID:-1000}:${WARDOGS_GID:-1000}"
    ports: ["127.0.0.1:18761:8080"]
    environment:
      RCON_HOST: ${RCON_HOST:?Set RCON_HOST in .env}
      RCON_PORT: ${RCON_PORT:-10246}
    volumes:
      - ./data:/data
      - ./.secrets/rcon_key:/run/secrets/rcon_key:ro
      - ./.secrets/service_api_key:/run/secrets/service_api_key:ro
      - ./service/config.json:/app/config.json:ro
  receiver:
    profiles: [events]
    build: ./event_receiver
    user: "${WARDOGS_UID:-1000}:${WARDOGS_GID:-1000}"
    ports: ["127.0.0.1:18762:8080"]
    volumes:
      - ./data/archive:/data
      - ./.secrets/event_token:/run/secrets/event_token:ro
      - ./.secrets/event_query_token:/run/secrets/event_query_token:ro
  cache:
    profiles: [events]
    build:
      context: ./event_receiver
      dockerfile: Dockerfile.cache
    user: "${WARDOGS_UID:-1000}:${WARDOGS_GID:-1000}"
    ports: ["127.0.0.1:18763:8080"]
    environment:
      RCON_HOST: ${RCON_HOST:?Set RCON_HOST in .env}
      RCON_PORT: ${RCON_PORT:-10246}
      EVENT_BASE_URL: http://receiver:8080
    volumes:
      - ./data/local-cache:/data
      - ./.secrets/rcon_key:/run/secrets/rcon_key:ro
      - ./.secrets/event_query_token:/run/secrets/event_query_token:ro
